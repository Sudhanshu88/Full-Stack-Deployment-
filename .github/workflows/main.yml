name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: sudhanshu88/django-backend
  FRONTEND_IMAGE: sudhanshu88/react-frontend

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy via Docker Compose
    needs: build-push
    runs-on: ubuntu-latest   # ✅ TEMPORARY (see note below)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deployment Placeholder
        run: echo "Deployment stage validated (self-hosted runner recommended for production)"
