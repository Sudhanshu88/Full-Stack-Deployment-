name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: yourdockerhubusername/django-backend
  FRONTEND_IMAGE: yourdockerhubusername/react-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          docker compose down
          docker compose pull
          docker compose up -d

